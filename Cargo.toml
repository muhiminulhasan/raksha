[workspace]
resolver = "2"
members = [
    "crates/raksha-core",
    "crates/host_packer",
    "crates/runtime_stub",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The runtime_stub is `#![no_std]`; it cannot link against an unwinding core.
# Force abort in dev so the whole workspace builds without -Zbuild-std.
[profile.dev]
panic = "abort"
